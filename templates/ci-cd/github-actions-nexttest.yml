name: NextTest Automated Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly test run at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run NextTest Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code & Test Suites
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Locate or Build NextTest Executable JAR
        run: |
          if [ -f "nexttest-desktop.jar" ]; then
            echo "Using pre-built root nexttest-desktop.jar"
          elif [ -f "nexttest/target/nexttest-desktop.jar" ]; then
            cp nexttest/target/nexttest-desktop.jar nexttest-desktop.jar
          elif [ -f "target/nexttest-desktop.jar" ]; then
            cp target/nexttest-desktop.jar nexttest-desktop.jar
          elif [ -f "nexttest/pom.xml" ]; then
            mvn -f nexttest/pom.xml clean package -DskipTests
            cp nexttest/target/nexttest-desktop.jar nexttest-desktop.jar
          else
            mvn clean package -DskipTests
            cp target/nexttest-desktop.jar nexttest-desktop.jar
          fi

      - name: Execute NextTest Headless Test Suite
        run: |
          java -jar nexttest-desktop.jar \
            --run sample-application/scenarios/01-browser-lifecycle-and-navigation.json \
            --browser Chrome \
            --headless \
            --output-dir target/nexttest-reports \
            --report-formats junit,html \
            --self-healing true

      - name: Publish Test Results to GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'NextTest Test Results'
          path: 'target/nexttest-reports/junit-results.xml'
          reporter: 'java-junit'

      - name: Archive HTML & XML Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexttest-test-reports
          path: target/nexttest-reports/
