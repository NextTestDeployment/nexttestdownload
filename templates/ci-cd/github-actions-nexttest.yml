name: MindQA Automated Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly test run at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run MindQA Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code & Test Suites
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build MindQA Executable JAR
        run: |
          mvn clean package -DskipTests

      - name: Execute MindQA Headless Test Suite
        run: |
          java -jar target/mindqa-desktop-0.1.0-SNAPSHOT.jar \
            --run ./suites/smoke-suite.xlsx \
            --browser Chrome \
            --headless \
            --output-dir ./target/mindqa-reports \
            --report-formats junit,html \
            --self-healing true

      - name: Publish Test Results to GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'MindQA Test Results'
          path: 'target/mindqa-reports/junit-results.xml'
          reporter: 'java-junit'

      - name: Archive HTML & XML Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mindqa-test-reports
          path: target/mindqa-reports/
          retention-days: 30
